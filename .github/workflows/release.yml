name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  prepare-release-pr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Check whether this push merged the release pull request
        id: merged_release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '.[] | select(.head.ref == "semantic-release" and .merged_at != null) | .number' | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release files
        id: prepare
        if: steps.merged_release.outputs.skip != 'true'
        run: node .github/scripts/prepare-release-pr.mjs

      - name: Create or update release pull request
        if: steps.prepare.outputs.release_required == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git fetch origin semantic-release:refs/remotes/origin/semantic-release || true
          git switch -C semantic-release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json
          HUSKY=0 git commit -m "chore(release): ${{ steps.prepare.outputs.version }}"
          git push --force-with-lease origin semantic-release

          PR_NUMBER="$(gh pr list --state open --head semantic-release --base main \
            --json number --jq '.[0].number')"

          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --title "chore(release): ${{ steps.prepare.outputs.version }}" \
              --body "Esta PR foi gerada pelo semantic-release. Revise o changelog e a versão antes de mesclar; a publicação ocorrerá após o merge."
          else
            gh pr create --head semantic-release --base main \
              --title "chore(release): ${{ steps.prepare.outputs.version }}" \
              --body "Esta PR foi gerada pelo semantic-release. Revise o changelog e a versão antes de mesclar; a publicação ocorrerá após o merge."
          fi

  publish-release:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'semantic-release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx semantic-release
